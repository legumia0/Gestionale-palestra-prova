  <style>
/* VOICE: strumento di lavoro per la reception, calmo e leggibile, nessuna decorazione.
   IDEA: la parete della palestra. Ardesia per i muri, magnesite per lo sfondo, e i
         nastri colorati che segnano le vie diventano lo stato di ogni cliente.
   PICTURE: il nastro a coda di rondine accanto a ogni nome: verde, giallo, rosso.
   COLOUR AND TYPE: gesso, ardesia, blu presa per le azioni; Fira Sans, quattro misure.
   LAYOUT: menu ardesia a sinistra sul computer, in alto su tablet e telefono;
           contenuto in una colonna, pulsanti grandi da toccare col dito. */

:root {
  color-scheme: light dark;
  --sfondo:      #F1F3F2;
  --pannello:    #FFFFFF;
  --ink:         #1C2830;
  --ink-soft:    #52616B;
  --linea:       #D2D9DC;
  --barra:       #1C2830;
  --blu:         #2347B8;   /* pulsanti principali */
  --blu-scuro:   #18348C;
  --link:        #2347B8;
  --verde:       #1F8A4C;
  --giallo:      #E5AC12;
  --giallo-ink:  #855700;
  --rosso:       #C42F2A;
  --grigio:      #9AA6AD;
  --ok-sfondo:   #E6F3EB;
  --err-sfondo:  #FBE9E8;
  --sopra:       #F7F9F9;

  --font: "Fira Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --piccolo: 0.875rem;
  --medio: 1.25rem;
  --grande: 1.875rem;
  --raggio: 6px;
}
:root[data-theme=light] { color-scheme: light; }
:root[data-theme=dark] { color-scheme: dark; }

/* Tema scuro: segue il dispositivo, oppure la scelta fatta su claude.ai */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme=light]) {
    --sfondo: #121A1F;
    --pannello: #1A242A;
    --ink: #E4EAED;
    --ink-soft: #A3B1B9;
    --linea: #33424B;
    --barra: #0B1115;
    --blu: #3A5FD0;
    --blu-scuro: #2C4CB3;
    --link: #9DB4FF;
    --verde: #4CC27E;
    --giallo-ink: #F0C24B;
    --rosso: #FF7A72;
    --grigio: #5E6B72;
    --ok-sfondo: #173324;
    --err-sfondo: #3A1A19;
    --sopra: #212C33;
  }
}
:root[data-theme=dark] {
  --sfondo: #121A1F;
  --pannello: #1A242A;
  --ink: #E4EAED;
  --ink-soft: #A3B1B9;
  --linea: #33424B;
  --barra: #0B1115;
  --blu: #3A5FD0;
  --blu-scuro: #2C4CB3;
  --link: #9DB4FF;
  --verde: #4CC27E;
  --giallo-ink: #F0C24B;
  --rosso: #FF7A72;
  --grigio: #5E6B72;
  --ok-sfondo: #173324;
  --err-sfondo: #3A1A19;
  --sopra: #212C33;
}

*, *::before, *::after { box-sizing: border-box; min-width: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font: 16px/1.5 var(--font);
  color: var(--ink);
  background: var(--sfondo);
  font-variant-numeric: tabular-nums;
  display: grid;
  grid-template-columns: 228px minmax(0, 1fr);
  min-height: 100vh;
}
h1, h2 { line-height: 1.15; margin: 0 0 0.5rem; text-wrap: balance; }
h1 { font-size: var(--grande); font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: var(--medio); font-weight: 600; }
p { margin: 0 0 0.75rem; }
a { color: var(--link); }
:focus-visible { outline: 3px solid var(--link); outline-offset: 2px; }
[hidden] { display: none !important; }
.nascosto { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------------------------------------------------------------- menu */
.barra {
  background: var(--barra);
  color: #fff;
  padding: 1.5rem 1rem;
  display: flex;
  flex-direction: column;
  gap: 2rem;
  position: sticky;
  top: 0;
  height: 100vh;
}
.marchio { color: #fff; text-decoration: none; font-weight: 800; font-size: 1.125rem; line-height: 1.2; padding: 0 0.5rem; }
.menu { display: flex; flex-direction: column; gap: 0.25rem; }
.menu a {
  color: #DCE3E7; text-decoration: none; font-size: 1.0625rem; font-weight: 500;
  padding: 0.7rem 0.75rem; border-radius: var(--raggio); min-height: 44px;
}
.menu a:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }
.menu a[aria-current] { background: #fff; color: #1C2830; }
.operatore { margin: auto 0 0; padding: 0 0.5rem; font-size: var(--piccolo); color: #B9C4CA; }

.contenuto { width: 100%; max-width: 980px; padding: 2rem 2.5rem 4rem; }

/* ------------------------------------------------------------ pulsanti */
.pulsante {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 46px; padding: 0.6rem 1.1rem;
  font: inherit; font-weight: 600; color: var(--ink);
  background: var(--pannello); border: 1.5px solid var(--ink); border-radius: var(--raggio);
  text-decoration: none; cursor: pointer; white-space: nowrap;
  touch-action: manipulation;
}
.pulsante:hover { background: var(--sopra); }
.pulsante:disabled { opacity: 0.6; cursor: progress; }
.pulsante-primario { background: var(--blu); border-color: var(--blu); color: #fff; }
.pulsante-primario:hover { background: var(--blu-scuro); border-color: var(--blu-scuro); }
.pulsante-secondario { border-color: var(--linea); color: var(--ink-soft); }
.pulsante-pericolo { border-color: var(--rosso); color: var(--rosso); }
.pulsante-pericolo:hover { background: var(--err-sfondo); }
.pulsante-piccolo { min-height: 44px; padding: 0.35rem 0.8rem; font-size: var(--piccolo); border-width: 1px; }

/* ------------------------------------------------------------ messaggi */
.avviso-flash {
  padding: 0.75rem 1rem; border-radius: var(--raggio); margin-bottom: 1.25rem;
  border-left: 5px solid var(--verde); background: var(--ok-sfondo);
}
.avviso-errore { border-left-color: var(--rosso); background: var(--err-sfondo); }
.avviso-info { border-left-color: var(--blu); background: var(--sopra); border: 1px solid var(--linea); border-left: 5px solid var(--blu); }
.azioni-centro { justify-content: center; }
.aiuto { color: var(--ink-soft); font-size: var(--piccolo); }
.caricamento { color: var(--ink-soft); padding: 1.5rem 0; }
.vuoto {
  padding: 2rem 1.5rem; border: 1.5px dashed var(--linea); border-radius: var(--raggio);
  color: var(--ink-soft); text-align: center;
}
.vuoto .pulsante { margin-top: 0.5rem; }
.pannello-centrale {
  max-width: 34rem; margin: 6vh auto 0; padding: 2rem;
  background: var(--pannello); border: 1px solid var(--linea); border-top: 8px solid var(--barra);
  border-radius: var(--raggio);
}
.etichetta {
  display: inline-block; font-size: 0.75rem; font-weight: 500; line-height: 1.4;
  padding: 0 0.45rem; border: 1px solid var(--ink-soft); border-radius: 999px; color: var(--ink-soft);
  vertical-align: 0.15em;
}
.conteggio {
  display: inline-block; min-width: 1.6em; padding: 0 0.45em; margin-left: 0.25rem;
  font-size: 0.85em; text-align: center; color: var(--pannello); background: var(--ink);
  border-radius: 999px; vertical-align: 0.1em;
}

/* --------------------------------------------------------- pagina Oggi */
.ricerca-grande { margin-bottom: 1rem; }
.ricerca-grande label { display: block; font-size: var(--grande); font-weight: 700; margin-bottom: 0.75rem; }
.ricerca-grande input {
  width: 100%; font: inherit; font-size: 1.375rem; padding: 0.85rem 1rem;
  border: 2px solid var(--ink); border-radius: var(--raggio); background: var(--pannello); color: var(--ink);
}
.ricerca-grande .aiuto { margin: 0.4rem 0 0; }
.azioni-rapide {
  display: flex; align-items: center; gap: 1.25rem; flex-wrap: wrap;
  padding-bottom: 1.75rem; margin-bottom: 1.75rem; border-bottom: 1px solid var(--linea);
}

  <!-- L'ordine conta: prima le regole, poi il database, poi le schermate, infine l'app -->
  <script>
/* =====================================================================
   REGOLE DELLA PALESTRA
   Date, età, stato dei documenti del cliente, controllo dei moduli.
   Non parla con il database: lavora solo sui dati che riceve.
   ===================================================================== */
const Regole = (() => {
  const due = (n) => String(n).padStart(2, "0");

  /* ------------------------------------------------------------ date */
  // Le date si salvano come testo 'AAAA-MM-GG' (es. '2026-11-20').
  function oggiISO() {
    const d = new Date();
    return `${d.getFullYear()}-${due(d.getMonth() + 1)}-${due(d.getDate())}`;
  }

  // data di oggi spostata di N giorni (negativo = nel passato)
  function dataTra(giorni) {
    const d = new Date();
    d.setDate(d.getDate() + giorni);
    return `${d.getFullYear()}-${due(d.getMonth() + 1)}-${due(d.getDate())}`;
  }

  function adessoISO() {
    const d = new Date();
    return `${oggiISO()} ${due(d.getHours())}:${due(d.getMinutes())}:${due(d.getSeconds())}`;
  }

  // '2026-11-20' -> oggetto data, oppure null se vuoto o non valido
  function aData(testo) {
    if (!testo || !/^\d{4}-\d{2}-\d{2}/.test(testo)) return null;
    const [a, m, g] = testo.slice(0, 10).split("-").map(Number);
    const d = new Date(a, m - 1, g);
    return d.getFullYear() === a && d.getMonth() === m - 1 && d.getDate() === g ? d : null;
  }

  // '2026-11-20' -> '20/11/2026'
  function dataIt(testo) {
    const d = aData(testo);
    return d ? `${due(d.getDate())}/${due(d.getMonth() + 1)}/${d.getFullYear()}` : "";
  }

  // giorni da oggi a quella data (negativo = già passata)
  function giorniDaOggi(testo) {
    const d = aData(testo);
    return d ? Math.round((d - aData(oggiISO())) / 86400000) : null;
  }

  function eta(dataNascita) {
    const d = aData(dataNascita);
    if (!d) return null;
    const o = new Date();
    let anni = o.getFullYear() - d.getFullYear();
    if (o.getMonth() < d.getMonth() || (o.getMonth() === d.getMonth() && o.getDate() < d.getDate())) anni--;
    return anni;
  }

  /* ---------------------------------------------- stato del cliente */
  function scadenza(etichetta, valore, preavviso) {
    const giorni = giorniDaOggi(valore);
    if (giorni === null) return { livello: "rosso", testo: `${etichetta}: manca` };
    if (giorni < 0) return { livello: "rosso", testo: `${etichetta} scaduto il ${dataIt(valore)}` };
    if (giorni <= preavviso) return { livello: "giallo", testo: `${etichetta} scade il ${dataIt(valore)}` };
    return null;
  }

  // Elenco dei problemi di un cliente, dal più grave
  function avvisi(c, imp) {
    const lista = [];
    const preavviso = imp.giorni_preavviso;
    const cert = scadenza("Certificato medico", c.scadenza_certificato, preavviso);
    if (cert) lista.push(cert);
    if (imp.usa_tesseramento) {
      const tess = scadenza("Tesseramento", c.scadenza_tessera, preavviso);
      if (tess) lista.push(tess);
    }
    if (!c.liberatoria_il) lista.push({ livello: "rosso", testo: "Liberatoria da firmare" });
    return lista.sort((a, b) => (a.livello === "rosso" ? 0 : 1) - (b.livello === "rosso" ? 0 : 1));
  }

  // Colore del nastro: come i nastri sulle vie, si capisce a colpo d'occhio
  function colore(c, imp) {
    if (!c.attivo) return "grigio";
    const livelli = avvisi(c, imp).map((a) => a.livello);
    if (livelli.includes("rosso")) return "rosso";
    if (livelli.includes("giallo")) return "giallo";
    return "verde";
  }

  /* ------------------------------------------------------ ricerca */
  // minuscole e senza accenti: "Nicolò" si trova anche scrivendo "nicolo"
  const semplice = (t) => String(t || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");

  // Ogni parola scritta deve comparire da qualche parte nei dati del cliente
  function corrisponde(c, ricerca) {
    const parole = semplice(ricerca).split(/\s+/).filter(Boolean);
    if (!parole.length) return true;
    const telefono = String(c.telefono || "").replace(/\D/g, "");
    const testo = semplice([c.nome, c.cognome, c.telefono, telefono, c.email,
                            c.numero_tessera, c.codice_fiscale].join(" "));
    return parole.every((p) => testo.includes(p));
  }

  const perCognome = (a, b) =>
    `${a.cognome} ${a.nome}`.localeCompare(`${b.cognome} ${b.nome}`, "it", { sensitivity: "base" });

  /* ------------------------------------------------- modulo cliente */
  const CAMPI_TESTO = ["nome", "cognome", "codice_fiscale", "email", "telefono", "indirizzo",
                       "contatto_emergenza", "numero_tessera", "note"];
  const CAMPI_DATA = ["data_nascita", "scadenza_tessera", "scadenza_certificato", "liberatoria_il", "privacy_il"];

  // Legge i campi del modulo e li controlla. Restituisce { dati, errori }.
  function leggiModuloCliente(form) {
    const valore = (nome) => {
      const el = form.elements[nome];
      const v = ((el && el.value) || "").trim();
      return v === "" ? null : v;
    };
    const dati = {};
    [...CAMPI_TESTO, ...CAMPI_DATA].forEach((campo) => { dati[campo] = valore(campo); });
    dati.autonomo = !!(form.elements.autonomo && form.elements.autonomo.checked);

    const errori = {};
    if (!dati.nome) errori.nome = "Il nome è obbligatorio.";
    if (!dati.cognome) errori.cognome = "Il cognome è obbligatorio.";
    if (dati.codice_fiscale) {
      dati.codice_fiscale = dati.codice_fiscale.toUpperCase().replace(/\s/g, "");
      if (!/^[A-Z0-9]{16}$/.test(dati.codice_fiscale))
        errori.codice_fiscale = "Il codice fiscale ha 16 caratteri, solo lettere e numeri.";
    }
    if (dati.email) {
      dati.email = dati.email.toLowerCase();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(dati.email))
        errori.email = "Questo indirizzo email non sembra corretto.";
    }
    if (dati.numero_tessera) dati.numero_tessera = dati.numero_tessera.toUpperCase();
    CAMPI_DATA.forEach((campo) => {
      if (dati[campo] && !aData(dati[campo])) errori[campo] = "Data non valida.";
    });
    if (dati.data_nascita && giorniDaOggi(dati.data_nascita) > 0)
      errori.data_nascita = "La data di nascita è nel futuro.";
    return { dati, errori };
  }

  // Campi che non possono essere uguali tra due clienti
  const CAMPI_UNICI = {
    email: "Questa email è già usata da un altro cliente.",
    codice_fiscale: "Questo codice fiscale è già registrato.",
    numero_tessera: "Questo numero di tessera è già assegnato.",
  };

  return { oggiISO, dataTra, adessoISO, aData, dataIt, giorniDaOggi, eta, avvisi, colore,
           corrisponde, perCognome, leggiModuloCliente, CAMPI_UNICI };
})();

</script>
  <script>
/* =====================================================================
   ARCHIVIO LOCALE (versione di prova)
   Quando la pagina NON è aperta su claude.ai, i dati si salvano nella
   memoria del browser di questo dispositivo.
   Offre gli stessi comandi del database online (collezioni e documenti),
   così il resto del programma non si accorge della differenza.
   Attenzione: i dati restano solo su questo dispositivo e questo browser.
   ===================================================================== */
const ArchivioLocale = (() => {
  const CHIAVE = "gestionale-palestra-dati";
  const copia = (o) => JSON.parse(JSON.stringify(o));
  const ultimo = (percorso) => percorso.split("/").pop();
  const pari = (percorso) => percorso.split("/").length % 2 === 0;

  function crea() {
    let memoriaOk = true;
    let dati = {};
    try {
      dati = JSON.parse(localStorage.getItem(CHIAVE) || "{}");
    } catch (e) {
      memoriaOk = false;           // navigazione privata o memoria bloccata
    }

    const ascoltatori = [];
    const avvisa = () => setTimeout(() => ascoltatori.slice().forEach((f) => f()), 0);
    function salva() {
      try { localStorage.setItem(CHIAVE, JSON.stringify(dati)); }
      catch (e) { memoriaOk = false; throw { code: "quota_exceeded", message: "memoria del browser piena o bloccata" }; }
      avvisa();
    }
    // Se la pagina è aperta in due schede, la seconda si aggiorna da sola
    window.addEventListener("storage", (e) => {
      if (e.key !== CHIAVE) return;
      try { dati = JSON.parse(e.newValue || "{}"); avvisa(); } catch (err) { /* ignora */ }
    });

    const info = { fromCache: false, hasPendingWrites: false };
    const fotoDoc = (percorso) => {
      const d = dati[percorso];
      return { id: ultimo(percorso), exists: !!d, data: () => (d ? copia(d) : undefined), metadata: info };
    };
    function ascolta(funzione) {
      ascoltatori.push(funzione);
      setTimeout(funzione, 0);
      return () => { const i = ascoltatori.indexOf(funzione); if (i >= 0) ascoltatori.splice(i, 1); };
    }

    function documento(percorso) {
      if (!pari(percorso)) throw new TypeError("Percorso di documento non valido: " + percorso);
      return {
        id: ultimo(percorso),
        path: percorso,
        get: async () => fotoDoc(percorso),
        set: async (o) => { dati[percorso] = copia(o); salva(); },
        update: async (o) => {
          if (!dati[percorso]) throw { code: "invalid_argument", message: "il documento non esiste" };
          Object.assign(dati[percorso], copia(o));
          salva();
        },
        delete: async () => { delete dati[percorso]; salva(); },
        onSnapshot: (dopo) => ascolta(() => dopo(fotoDoc(percorso))),
        collection: (sotto) => collezione(percorso + "/" + sotto),
      };
    }

    function ricerca(percorso, filtri, massimo) {
      const esegui = () => {
        const livello = percorso.split("/").length + 1;
        const docs = Object.keys(dati).sort()
          .filter((p) => p.indexOf(percorso + "/") === 0 && p.split("/").length === livello)
          .map(fotoDoc)
          .filter((d) => filtri.every(([campo, op, valore]) => {
            const v = d.data()[campo];
            return op === "==" ? v === valore : op === "!=" ? v !== valore : true;
          }))
          .slice(0, massimo);
        return { docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: info };
      };
      return {
        where: (campo, op, valore) => ricerca(percorso, filtri.concat([[campo, op, valore]]), massimo),
        orderBy: () => ricerca(percorso, filtri, massimo),
        limit: (n) => ricerca(percorso, filtri, n),
        get: async () => esegui(),
        onSnapshot: (dopo) => ascolta(() => dopo(esegui())),
      };
    }

    function collezione(percorso) {
      if (pari(percorso)) throw new TypeError("Percorso di collezione non valido: " + percorso);
      return Object.assign(ricerca(percorso, [], 1000), {
        path: percorso,
        doc: (id) => documento(percorso + "/" + (id || Math.random().toString(36).slice(2))),
      });
    }

    return { db: { doc: documento, collection: collezione }, memoriaOk: () => memoriaOk };
  }

  return { crea };
})();

  <script>
/* =====================================================================
   ARCHIVIO: l'unico file che parla con il database.

   Aperta su claude.ai, la pagina usa il database di claude.ai: ci entrano
   solo le persone a cui condividi la pagina (lo staff).
   Aperta altrove (per esempio su GitHub Pages) usa l'archivio locale di
   prova (archivio-locale.js): i dati restano nel browser del dispositivo.
   Quando apriremo l'area clienti a tutti (Passo 6) si cambierà SOLO
   questo file, per usare un database pubblico come Firestore di Google,
   che funziona allo stesso modo (collezioni e documenti).

   Struttura dei dati:
     clienti/<id>              un documento per cliente
     impostazioni/palestra     nome della palestra e preferenze
   ===================================================================== */
const Archivio = (() => {
  let db = null;
  let utente = null;

  const stato = {
    modalita: "claude",   // "claude" = database online di claude.ai, "locale" = prova nel browser
    memoriaOk: true,      // solo per la prova: il browser lascia salvare i dati?
    disponibile: false,   // il database risponde?
    puoScrivere: null,    // true / false / null = non si sa ancora
    amministratore: false,
    idUtente: null,
    nomeUtente: "",
  };

  const IMPOSTAZIONI_PREDEFINITE = {
    nome_palestra: "Palestra di arrampicata",
    usa_tesseramento: true,     // false se non rilasciate tessere associative
    giorni_preavviso: 30,       // da quanti giorni prima segnalare una scadenza
  };

  const pausa = (ms) => new Promise((ok) => setTimeout(ok, ms));
  const conTempoMassimo = (promessa, ms) =>
    Promise.race([promessa, pausa(ms).then(() => null)]);

  // Codice univoco per ogni nuovo cliente, es. "c-lq3k9x-4f2a"
  const nuovoId = () =>
    "c-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 6);

  async function avvia() {
    const c = window.claude;
    if (!c || typeof c.use !== "function") {
      // Pagina aperta fuori da claude.ai: versione di prova con i dati nel browser
      const locale = ArchivioLocale.crea();
      db = locale.db;
      stato.modalita = "locale";
      stato.memoriaOk = locale.memoriaOk();
      stato.disponibile = true;
      stato.puoScrivere = true;
      stato.amministratore = true;
      return stato;
    }
    db = await conTempoMassimo(c.use("db").catch(() => null), 12000);
    utente = await conTempoMassimo(c.use("user").catch(() => null), 12000);
    stato.disponibile = !!db;
    if (utente) {
      try { stato.amministratore = !!(await utente.canEdit()); } catch (e) { /* resta false */ }
      try { stato.puoScrivere = await utente.can("data.write"); } catch (e) { stato.puoScrivere = null; }
      try { stato.idUtente = await utente.id(); } catch (e) { stato.idUtente = null; }
      try { const io = await utente.me(); stato.nomeUtente = (io && io.name) || ""; } catch (e) { stato.nomeUtente = ""; }
    }
    return stato;
  }

  // Le scritture si ritentano una volta se il database ha un intoppo momentaneo
  async function scrivi(operazione) {
    try {
      return await operazione();
    } catch (e) {
      if (e && e.code === "unavailable") {
        await pausa(400 + Math.random() * 600);
        return operazione();
      }
      throw e;
    }
  }

  function messaggioErrore(e) {
    switch (e && e.code) {
      case "invalid_argument":
        return "Non è stato possibile salvare: serve il permesso di modifica su questa pagina.";
      case "quota_exceeded":
        return "Il database è pieno. Archivia o elimina i clienti che non servono più.";
      case "resource_exhausted":
        return "Troppe operazioni in poco tempo. Aspetta qualche secondo e riprova.";
      case "revoked":
        return "Il database non è più disponibile in questa pagina.";
      default:
        return "Il database non risponde. Controlla la connessione e riprova.";
    }
  }

  const conId = (doc) => ({ id: doc.id, ...doc.data() });

  /* ------------------------------------------------------- clienti */
  // Ascolta i clienti attivi: la funzione viene richiamata a ogni modifica,
  // anche quelle fatte da un altro computer della palestra.
  function ascoltaClientiAttivi(suDati, suErrore) {
    return db.collection("clienti").where("attivo", "==", true).limit(1000)
      .onSnapshot((snap) => suDati(snap.docs.map(conId), snap.metadata), suErrore);
  }

  async function clientiArchiviati() {
    const snap = await db.collection("clienti").where("attivo", "==", false).limit(1000).get();
    return snap.docs.map(conId);
  }

  async function leggiCliente(id) {
    const doc = await db.doc("clienti/" + id).get();
    return doc.exists ? conId(doc) : null;
  }

  // Restituisce gli id dei clienti che hanno già quel valore (es. la stessa email)
  async function clientiCon(campo, valore) {
    const snap = await db.collection("clienti").where(campo, "==", valore).limit(5).get();
    return snap.docs.map((d) => d.id);
  }

  async function creaCliente(dati) {
    const id = nuovoId();
    await scrivi(() => db.doc("clienti/" + id).set({
      ...dati,
      attivo: true,
      creato_il: Regole.adessoISO(),
      creato_da: stato.idUtente,
    }));
    return id;
  }

  async function aggiornaCliente(id, modifiche) {
    await scrivi(() => db.doc("clienti/" + id).update({
      ...modifiche,
      modificato_il: Regole.adessoISO(),
      modificato_da: stato.idUtente,
    }));
  }

  async function eliminaCliente(id) {
    await scrivi(() => db.doc("clienti/" + id).delete());
  }

  /* --------------------------------------------------- impostazioni */
  function ascoltaImpostazioni(suDati, suErrore) {
    return db.doc("impostazioni/palestra").onSnapshot(
      (doc) => suDati({ ...IMPOSTAZIONI_PREDEFINITE, ...(doc.exists ? doc.data() : {}) }),
      suErrore);
  }

  async function salvaImpostazioni(dati) {
    await scrivi(() => db.doc("impostazioni/palestra").set(dati));
  }

  return { stato, IMPOSTAZIONI_PREDEFINITE, avvia, messaggioErrore,
           ascoltaClientiAttivi, clientiArchiviati, leggiCliente, clientiCon,
           creaCliente, aggiornaCliente, eliminaCliente,
           ascoltaImpostazioni, salvaImpostazioni };
})();

</script>
  <script>
/* =====================================================================
   VISTE: l'HTML di ogni schermata.
   Ogni funzione restituisce il codice HTML di una pagina o di un pezzo.
   I dati inseriti dalle persone passano sempre da html`...`, che li
   "disinnesca" (un nome come <script> resta solo testo).
   ===================================================================== */
const Viste = (() => {
  /* ------------------------------------------------ strumenti HTML */
  class Sicuro { constructor(t) { this.t = t; } toString() { return this.t; } }
  const esc = (t) => String(t).replace(/[&<>"']/g,
    (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pezzo = (v) => v instanceof Sicuro ? v.t
    : Array.isArray(v) ? v.map(pezzo).join("")
    : v === null || v === undefined || v === false ? "" : esc(v);
  const html = (parti, ...valori) =>
    new Sicuro(parti.reduce((out, p, i) => out + pezzo(valori[i - 1]) + p));

  const R = Regole;
  const plurale = (n, uno, tanti) => `${n} ${n === 1 ? uno : tanti}`;

  /* ---------------------------------------------- pezzi riutilizzati */
  function riga(c, imp) {
    const col = R.colore(c, imp);
    const av = R.avvisi(c, imp);
    const stato = col === "grigio" ? "Archiviato"
      : av.length ? av[0].testo + (av.length > 1 ? ` e altri ${av.length - 1}` : "")
      : "Documenti in regola";
    return html`
      <a class="riga-cliente" href="#cliente-${c.id}">
        <span class="nastro nastro-${col}" aria-hidden="true"></span>
        <span class="riga-nome">${c.cognome} ${c.nome}${c.esempio ? html` <span class="etichetta">esempio</span>` : ""}</span>
        <span class="riga-dati">
          ${c.numero_tessera ? html`<span>Tessera ${c.numero_tessera}</span>` : ""}
          ${c.telefono ? html`<span>${c.telefono}</span>` : ""}
        </span>
        <span class="riga-stato stato-${col}">${stato}</span>
      </a>`;
  }

  const elenco = (clienti, imp) =>
    html`<div class="elenco-clienti">${clienti.map((c) => riga(c, imp))}</div>`;

  function campo(nome, etichetta, dati, errori, { tipo = "text", aiuto = "", extra = "" } = {}) {
    const err = errori[nome];
    return html`
      <div class="campo${err ? " campo-errore" : ""}">
        <label for="${nome}">${etichetta}</label>
        <input id="${nome}" name="${nome}" type="${tipo}" value="${dati[nome] || ""}"
               ${new Sicuro(extra)} ${err ? new Sicuro(`aria-invalid="true" aria-describedby="${nome}-errore"`) : ""}>
        ${err ? html`<p class="errore-campo" id="${nome}-errore">${err}</p>`
              : aiuto ? html`<p class="aiuto">${aiuto}</p>` : ""}
      </div>`;
  }

  function campoDataConOggi(nome, etichetta, dati, errori) {
    const err = errori[nome];
    return html`
      <div class="campo${err ? " campo-errore" : ""}">
        <label for="${nome}">${etichetta}</label>
        <div class="campo-con-pulsante">
          <input id="${nome}" name="${nome}" type="date" value="${dati[nome] || ""}">
          <button type="button" class="pulsante pulsante-piccolo" data-oggi="${nome}">Oggi</button>
        </div>
        ${err ? html`<p class="errore-campo" id="${nome}-errore">${err}</p>` : ""}
      </div>`;
  }

  const messaggio = (m) => m
    ? html`<p class="avviso-flash avviso-${m.tipo}" role="status">${m.testo}</p>` : "";

  /* ---------------------------------------------------- stati pagina */
  const caricamento = (testo) => html`<p class="caricamento" role="status">${testo}</p>`;

  const nonDisponibile = () => html`
    <section class="pannello-centrale">
      <h1>Il database non è raggiungibile</h1>
      <p>Il gestionale salva i dati nel database di questa pagina su claude.ai.
         Aprila dal link di claude.ai, con l'account a cui è stata condivisa.</p>
      <p class="aiuto">Se l'hai già aperta da lì, controlla la connessione a internet e ricarica.</p>
    </section>`;

  const nonTrovato = () => html`
    <section class="pannello-centrale">
      <h1>Questo cliente non esiste</h1>
      <p>Forse è stato eliminato da un altro computer.</p>
      <a class="pulsante pulsante-primario" href="#clienti">Vai ai clienti</a>
    </section>`;

  /* ----------------------------------------------------------- Oggi */
  const oggi = (S) => html`
    <section class="ricerca-grande">
      <label for="cerca">Cerca un cliente</label>
      <input id="cerca" type="search" value="${S.ricerca}" autocomplete="off" enterkeyhint="search"
             placeholder="Nome, cognome, telefono o numero di tessera">
      <p class="aiuto">I risultati compaiono mentre scrivi. Con un numero di tessera esatto, Invio apre la scheda.</p>
    </section>
    <div class="azioni-rapide">
      ${S.puoScrivere ? html`<a class="pulsante" href="#nuovo-cliente">Nuovo cliente</a>` : ""}
      <p class="riepilogo" id="riepilogo">${riepilogo(S)}</p>
    </div>
    <section id="zona-oggi">${zonaOggi(S)}</section>`;

  function riepilogo(S) {
    if (!S.caricati) return "";
    const meseISO = R.oggiISO().slice(0, 7);
    const nuovi = S.clienti.filter((c) => (c.creato_il || "").startsWith(meseISO)).length;
    return `${plurale(S.clienti.length, "cliente attivo", "clienti attivi")}, ${plurale(nuovi, "nuovo", "nuovi")} questo mese.`;
  }

  function zonaOggi(S) {
    if (!S.caricati) return caricamento(S.lento ? "Il database non risponde ancora. Controlla la connessione." : "Carico i clienti…");
    if (S.ricerca.trim()) {
      const trovati = S.clienti.filter((c) => R.corrisponde(c, S.ricerca));
      return trovati.length
        ? html`<h2>Risultati <span class="conteggio">${trovati.length}</span></h2>${elenco(trovati.slice(0, 50), S.imp)}`
        : html`<div class="vuoto"><p>Nessun cliente attivo trovato per “${S.ricerca}”.</p>
               <p class="aiuto">Prova con il solo cognome, oppure cerca tra gli archiviati.</p>
               <a class="pulsante" href="#clienti-archiviati">Cerca tra gli archiviati</a></div>`;
    }
    const daSistemare = S.clienti
      .map((c) => ({ c, col: R.colore(c, S.imp) }))
      .filter((r) => r.col === "rosso" || r.col === "giallo")
      .sort((a, b) => (a.col === "rosso" ? 0 : 1) - (b.col === "rosso" ? 0 : 1))
      .map((r) => r.c);
    if (!S.clienti.length) return html`
      <div class="vuoto"><p>Non ci sono ancora clienti.</p>
        <div class="azioni-modulo azioni-centro">
          ${S.puoScrivere ? html`<a class="pulsante pulsante-primario" href="#nuovo-cliente">Aggiungi il primo cliente</a>` : ""}
          ${S.modalita === "locale" ? html`<button type="button" class="pulsante" data-azione="carica-esempi">Carica 5 clienti di esempio</button>` : ""}
        </div></div>`;
    if (!daSistemare.length) return html`
      <h2>Da sistemare</h2><p class="vuoto">Tutti i clienti attivi hanno i documenti in regola.</p>`;
    return html`
      <h2>Da sistemare <span class="conteggio">${daSistemare.length}</span></h2>
      <p class="aiuto">Documenti mancanti, scaduti o in scadenza nei prossimi ${S.imp.giorni_preavviso} giorni.
         Chiedili al cliente quando passa in reception.</p>
      ${elenco(daSistemare, S.imp)}`;
  }

  /* -------------------------------------------------------- Clienti */
  const FILTRI = [["clienti", "Attivi"], ["clienti-avvisi", "Con documenti da sistemare"], ["clienti-archiviati", "Archiviati"]];

  const clienti = (S, filtro) => html`
    <div class="intestazione">
      <h1>Clienti</h1>
      ${S.puoScrivere ? html`<a class="pulsante pulsante-primario" href="#nuovo-cliente">Nuovo cliente</a>` : ""}
    </div>
    <div class="ricerca">
      <label for="cerca" class="nascosto">Cerca</label>
      <input id="cerca" type="search" value="${S.ricerca}" autocomplete="off" enterkeyhint="search"
             placeholder="Nome, cognome, telefono, email, tessera o codice fiscale">
    </div>
    <nav class="filtri" aria-label="Filtra i clienti">
      ${FILTRI.map(([h, t]) => html`<a href="#${h}" ${h === filtro ? new Sicuro('aria-current="true"') : ""}>${t}</a>`)}
    </nav>
    <div id="zona-elenco">${zonaElenco(S, filtro)}</div>`;

  function zonaElenco(S, filtro) {
    let lista;
    if (filtro === "clienti-archiviati") {
      if (S.archiviati === null) return caricamento("Carico gli archiviati…");
      lista = S.archiviati;
    } else {
      if (!S.caricati) return caricamento(S.lento ? "Il database non risponde ancora. Controlla la connessione." : "Carico i clienti…");
      lista = S.clienti;
      if (filtro === "clienti-avvisi") lista = lista.filter((c) => ["rosso", "giallo"].includes(R.colore(c, S.imp)));
    }
    const trovati = lista.filter((c) => R.corrisponde(c, S.ricerca));
    if (trovati.length) return html`
      <p class="aiuto">${plurale(trovati.length, "cliente", "clienti")}${S.ricerca.trim() ? ` per “${S.ricerca.trim()}”` : ""}</p>
      ${elenco(trovati, S.imp)}`;
    if (S.ricerca.trim()) return html`
      <div class="vuoto"><p>Nessun cliente trovato per “${S.ricerca.trim()}”.</p>
        <p class="aiuto">Prova con il solo cognome, oppure aggiungilo come nuovo cliente.</p>
        ${S.puoScrivere ? html`<a class="pulsante pulsante-primario" href="#nuovo-cliente">Nuovo cliente</a>` : ""}</div>`;
    return html`<p class="vuoto">Nessun cliente in questo elenco.</p>`;
  }

  /* --------------------------------------------------------- Scheda */
  function scheda(S, c) {
    const col = R.colore(c, S.imp);
    const av = R.avvisi(c, S.imp);
    const anni = R.eta(c.data_nascita);
    const titoli = {
      grigio: "Cliente archiviato", rosso: "Da sistemare prima di arrampicare",
      giallo: "In regola, con una scadenza vicina", verde: "Documenti in regola",
    };
    const voce = (etichetta, valore, mancante) => html`
      <dt>${etichetta}</dt><dd>${valore || html`<span class="manca">${mancante}</span>`}</dd>`;
    const scrive = S.puoScrivere;

    return html`
      <a class="indietro" href="#clienti">Torna ai clienti</a>
      <div class="intestazione intestazione-scheda">
        <span class="nastro nastro-grande nastro-${col}" aria-hidden="true"></span>
        <div>
          <h1>${c.nome} ${c.cognome}</h1>
          <p class="sottotitolo">
            ${c.numero_tessera ? `Tessera ${c.numero_tessera}. ` : ""}${anni !== null ? `${anni} anni. ` : ""}Cliente dal ${R.dataIt(c.creato_il)}.
            ${c.esempio ? html`<span class="etichetta">esempio</span>` : ""}
          </p>
        </div>
        ${scrive ? html`<a class="pulsante" href="#modifica-${c.id}">Modifica</a>` : ""}
      </div>

      <section class="stato-cliente stato-box-${col}">
        <h2>${titoli[col]}</h2>
        ${col === "grigio" ? html`<p>Riattivalo se torna in palestra.</p>` : ""}
        ${av.length && col !== "grigio" ? html`<ul class="lista-avvisi">${av.map((a) => html`<li class="avviso-${a.livello}">${a.testo}</li>`)}</ul>` : ""}
        ${anni !== null && anni < 18 ? html`<p class="nota-minore">Minorenne: la liberatoria va firmata da un genitore o tutore.</p>` : ""}
        <p class="autonomia">${c.autonomo
          ? "Arrampica in autonomia: verifica di sicura superata."
          : "Non ancora autonomo: arrampica con un istruttore o dopo la verifica di sicura."}</p>
        ${scrive && !c.liberatoria_il && c.attivo
          ? html`<button type="button" class="pulsante pulsante-primario" data-azione="liberatoria" data-id="${c.id}">Liberatoria firmata oggi</button>` : ""}
      </section>

      <div class="griglia-dati">
        <section class="sezione">
          <h2>Contatti</h2>
          <dl class="dati">
            ${voce("Telefono", c.telefono, "non indicato")}
            ${voce("Email", c.email, "non indicata")}
            ${voce("Indirizzo", c.indirizzo, "non indicato")}
            ${voce("In caso di emergenza", c.contatto_emergenza, "non indicato")}
          </dl>
        </section>
        <section class="sezione">
          <h2>Documenti</h2>
          <dl class="dati">
            ${voce("Certificato medico", c.scadenza_certificato && `scade il ${R.dataIt(c.scadenza_certificato)}`, "non consegnato")}
            ${voce("Liberatoria", c.liberatoria_il && `firmata il ${R.dataIt(c.liberatoria_il)}`, "da firmare")}
            ${S.imp.usa_tesseramento ? voce("Tesseramento", c.scadenza_tessera && `valido fino al ${R.dataIt(c.scadenza_tessera)}`, "non tesserato") : ""}
            ${voce("Consenso privacy", c.privacy_il && `dato il ${R.dataIt(c.privacy_il)}`, "non registrato")}
            ${voce("Data di nascita", R.dataIt(c.data_nascita), "non indicata")}
            ${voce("Codice fiscale", c.codice_fiscale, "non indicato")}
          </dl>
        </section>
      </div>

      ${c.note ? html`<section class="sezione"><h2>Note</h2><p class="note">${c.note}</p></section>` : ""}

      <section class="sezione in-arrivo">
        <h2>Abbonamenti e ingressi</h2>
        <p>Qui compariranno l'abbonamento in corso, gli ingressi registrati e i pagamenti (Passo 2).</p>
      </section>

      ${scrive ? html`
        <div class="zona-archivio">
          ${c.attivo
            ? html`<button type="button" class="pulsante pulsante-secondario" data-azione="archivia" data-id="${c.id}">Archivia cliente</button>
                   <p class="aiuto">Il cliente sparisce dagli elenchi ma i suoi dati restano. Puoi riattivarlo quando vuoi.</p>`
            : html`<div class="azioni-modulo">
                     <button type="button" class="pulsante pulsante-primario" data-azione="riattiva" data-id="${c.id}">Riattiva cliente</button>
                     ${S.amministratore ? html`<button type="button" class="pulsante pulsante-pericolo" data-azione="chiedi-elimina">Elimina definitivamente</button>` : ""}
                   </div>
                   <div class="conferma" id="conferma-elimina" hidden>
                     <p><strong>Eliminare per sempre ${c.nome} ${c.cognome}?</strong>
                        I suoi dati spariscono dal gestionale e non si possono recuperare.
                        Usalo quando il cliente chiede la cancellazione dei suoi dati.</p>
                     <div class="azioni-modulo">
                       <button type="button" class="pulsante pulsante-pericolo" data-azione="elimina" data-id="${c.id}">Sì, elimina</button>
                       <button type="button" class="pulsante pulsante-secondario" data-azione="annulla-elimina">Annulla</button>
                     </div>
                   </div>`}
        </div>` : ""}`;
  }

  /* --------------------------------------------------------- Modulo */
  function modulo(S, cliente, dati, errori) {
    const tess = S.imp.usa_tesseramento;
    return html`
      ${cliente
        ? html`<a class="indietro" href="#cliente-${cliente.id}">Torna alla scheda</a><h1>Modifica ${cliente.nome} ${cliente.cognome}</h1>`
        : html`<a class="indietro" href="#clienti">Torna ai clienti</a><h1>Nuovo cliente</h1>
               <p class="aiuto">Sono obbligatori solo nome e cognome. Il resto si può completare dopo.</p>`}
      ${Object.keys(errori).length
        ? html`<p class="avviso-flash avviso-errore" role="alert">${errori._ || "Controlla i campi segnati in rosso."}</p>` : ""}

      <form class="modulo" data-modulo="cliente" ${cliente ? new Sicuro(`data-id="${esc(cliente.id)}"`) : ""} novalidate>
        <fieldset>
          <legend>Dati personali</legend>
          <div class="campi-due">
            ${campo("nome", "Nome", dati, errori, { extra: 'required autocomplete="off"' })}
            ${campo("cognome", "Cognome", dati, errori, { extra: 'required autocomplete="off"' })}
            ${campo("data_nascita", "Data di nascita", dati, errori, { tipo: "date" })}
            ${campo("codice_fiscale", "Codice fiscale", dati, errori, { extra: 'maxlength="16" autocapitalize="characters" autocomplete="off"' })}
          </div>
        </fieldset>
        <fieldset>
          <legend>Contatti</legend>
          <div class="campi-due">
            ${campo("telefono", "Telefono", dati, errori, { tipo: "tel" })}
            ${campo("email", "Email", dati, errori, { tipo: "email", aiuto: "Servirà al cliente per accedere all'area online.", extra: 'autocapitalize="off"' })}
            ${campo("indirizzo", "Indirizzo", dati, errori)}
            ${campo("contatto_emergenza", "Contatto in caso di emergenza", dati, errori, { aiuto: "Nome e telefono di un familiare o amico." })}
          </div>
        </fieldset>
        <fieldset>
          <legend>Documenti</legend>
          <div class="campi-due">
            ${campo("scadenza_certificato", "Scadenza certificato medico", dati, errori, { tipo: "date" })}
            ${campoDataConOggi("liberatoria_il", "Liberatoria firmata il", dati, errori)}
            ${campo("numero_tessera", tess ? "Numero tessera" : "Numero tessera o badge", dati, errori, { extra: 'autocapitalize="characters" autocomplete="off"' })}
            ${tess ? campo("scadenza_tessera", "Tessera valida fino al", dati, errori, { tipo: "date" }) : ""}
            ${campoDataConOggi("privacy_il", "Consenso privacy dato il", dati, errori)}
          </div>
        </fieldset>
        <fieldset>
          <legend>Arrampicata</legend>
          <label class="spunta">
            <input type="checkbox" name="autonomo" ${dati.autonomo ? new Sicuro("checked") : ""}>
            <span>Ha superato la verifica di sicura e può arrampicare in autonomia</span>
          </label>
          <div class="campo">
            <label for="note">Note</label>
            <textarea id="note" name="note" rows="3">${dati.note || ""}</textarea>
            <p class="aiuto">Per esempio: chi lo accompagna, corsi a cui è interessato.</p>
          </div>
        </fieldset>
        <div class="azioni-modulo">
          <button type="submit" class="pulsante pulsante-primario">${cliente ? "Salva modifiche" : "Salva cliente"}</button>
          <a class="pulsante pulsante-secondario" href="${cliente ? "#cliente-" + cliente.id : "#clienti"}">Annulla</a>
        </div>
      </form>`;
  }

  /* --------------------------------------------------- Impostazioni */
  function impostazioni(S, esempi) {
    const imp = S.imp;
    const modifica = S.amministratore;
    return html`
      <h1>Impostazioni</h1>
      <form class="modulo" data-modulo="impostazioni" novalidate>
        <fieldset ${modifica ? "" : new Sicuro("disabled")}>
          <legend>La palestra</legend>
          ${campo("nome_palestra", "Nome della palestra", imp, {}, { extra: "required" })}
          ${campo("giorni_preavviso", "Avvisa delle scadenze con quanti giorni di anticipo", imp, {}, { tipo: "number", extra: 'min="1" max="120" inputmode="numeric"' })}
          <label class="spunta">
            <input type="checkbox" name="usa_tesseramento" ${imp.usa_tesseramento ? new Sicuro("checked") : ""}>
            <span>La palestra rilascia una tessera associativa con scadenza (es. ASD)</span>
          </label>
          ${modifica ? html`<button type="submit" class="pulsante pulsante-primario">Salva impostazioni</button>`
                     : html`<p class="aiuto">Solo il proprietario e chi ha il permesso di modifica può cambiarle.</p>`}
        </fieldset>
      </form>

      ${S.modalita === "locale" ? html`
        <section class="sezione">
          <h2>Versione di prova</h2>
          <p>I dati sono salvati solo nel browser di questo dispositivo: un altro computer o un altro
             browser vede un gestionale vuoto. Usala per provare, con clienti di esempio o inventati.</p>
          <p>Quando il gestionale andrà online (Passo 6), i dati staranno in un database su internet
             e tutti i computer della palestra vedranno gli stessi clienti.</p>
          ${!S.memoriaOk ? html`<p class="avviso-flash avviso-errore">Questo browser non lascia salvare i dati
             (succede in navigazione privata): chiudendo la pagina si perdono.</p>` : ""}
        </section>` : html`
        <section class="sezione">
          <h2>Chi può usare il gestionale</h2>
          <p>Il gestionale vede solo chi ha accesso a questa pagina su claude.ai.
             Per aggiungere chi lavora in reception, condividi la pagina da claude.ai
             e dagli il permesso di modifica: potrà cercare, aggiungere e modificare i clienti.</p>
          <p class="aiuto">Hai fatto l'accesso come ${S.nomeUtente || "utente di claude.ai"}.</p>
        </section>`}

      ${modifica && esempi.length ? html`
        <section class="sezione">
          <h2>Clienti di esempio</h2>
          <p>Ci sono ${plurale(esempi.length, "cliente di esempio", "clienti di esempio")}, inseriti per provare il gestionale.
             Quando inizi a usarlo davvero, eliminali.</p>
          <button type="button" class="pulsante pulsante-pericolo" data-azione="elimina-esempi">Elimina i clienti di esempio</button>
        </section>` : ""}`;
  }

  return { html, messaggio, caricamento, nonDisponibile, nonTrovato, oggi, zonaOggi, riepilogo,
           clienti, zonaElenco, scheda, modulo, impostazioni };
})();

</script>
  <script>
/* =====================================================================
   APP: collega tutto.
   - legge l'indirizzo (#oggi, #clienti, #cliente-…) e mostra la vista
   - tiene i clienti aggiornati in tempo reale
   - gestisce pulsanti e moduli
   ===================================================================== */
{
  const S = {
    clienti: [],           // clienti attivi, in ordine di cognome
    caricati: false,
    lento: false,          // il database non ha ancora risposto dopo 10 secondi
    imp: { ...Archivio.IMPOSTAZIONI_PREDEFINITE },
    archiviati: null,      // caricati solo quando servono
    ricerca: "",
    messaggio: null,       // { tipo: "ok" | "errore", testo } mostrato una volta
    puoScrivere: false,
    amministratore: false,
    nomeUtente: "",
    rotta: null,
    modalita: "claude",
    memoriaOk: true,
    leggiDiNuovo: null,    // id di un cliente appena modificato: rileggilo dal database
  };

  const contenuto = document.getElementById("contenuto");
  const banner = document.getElementById("banner");
  let numeroVista = 0;

  /* ------------------------------------------------------- indirizzi */
  function leggiRotta() {
    const h = decodeURIComponent(location.hash.slice(1));
    let m;
    if (["clienti", "clienti-avvisi", "clienti-archiviati"].includes(h)) return { vista: "clienti", filtro: h };
    if (h === "nuovo-cliente") return { vista: "modulo" };
    if ((m = h.match(/^cliente-(.+)$/))) return { vista: "scheda", id: m[1] };
    if ((m = h.match(/^modifica-(.+)$/))) return { vista: "modulo", id: m[1] };
    if (h === "impostazioni") return { vista: "impostazioni" };
    return { vista: "oggi" };
  }

  function vai(indirizzo, messaggio) {
    S.messaggio = messaggio || null;
    if (location.hash === "#" + indirizzo) mostra();
    else location.hash = indirizzo;
  }

  async function trovaCliente(id) {
    if (S.leggiDiNuovo === id) {
      S.leggiDiNuovo = null;
      return Archivio.leggiCliente(id);
    }
    return S.clienti.find((c) => c.id === id)
      || (S.archiviati || []).find((c) => c.id === id)
      || Archivio.leggiCliente(id);
  }

  /* ------------------------------------------------- mostra la vista */
  async function mostra() {
    const r = (S.rotta = leggiRotta());
    const mia = ++numeroVista;
    const msg = Viste.messaggio(S.messaggio);
    S.messaggio = null;
    const metti = (html) => {
      if (mia !== numeroVista) return;          // nel frattempo si è cambiata pagina
      contenuto.innerHTML = String(msg) + String(html);
      window.scrollTo(0, 0);
      const cerca = document.getElementById("cerca");
      if (cerca && matchMedia("(pointer: fine)").matches) cerca.focus();   // sul tablet niente tastiera a sorpresa
    };

    document.querySelectorAll(".menu a").forEach((a) => {
      const attiva = a.dataset.vista === r.vista || (a.dataset.vista === "clienti" && ["scheda", "modulo"].includes(r.vista));
      a.toggleAttribute("aria-current", attiva);
      if (attiva) a.setAttribute("aria-current", "page");
    });

    try {
      switch (r.vista) {
        case "oggi":
          return metti(Viste.oggi(S));
        case "clienti":
          if (r.filtro === "clienti-archiviati") {
            S.archiviati = null;          // ogni volta si rileggono: sono pochi e cambiano di rado
            caricaArchiviati();
          }
          return metti(Viste.clienti(S, r.filtro));
        case "scheda": {
          if (!S.clienti.some((c) => c.id === r.id)) contenuto.innerHTML = String(Viste.caricamento("Apro la scheda…"));
          const c = await trovaCliente(r.id);
          return metti(c ? Viste.scheda(S, c) : Viste.nonTrovato());
        }
        case "modulo": {
          if (!S.puoScrivere) return metti(Viste.html`<p class="vuoto">Per aggiungere o modificare clienti serve il permesso di modifica.</p>`);
          if (!r.id) return metti(Viste.modulo(S, null, {}, {}));
          const c = await trovaCliente(r.id);
          return metti(c ? Viste.modulo(S, c, { ...c }, {}) : Viste.nonTrovato());
        }
        case "impostazioni":
          return metti(Viste.impostazioni(S, S.clienti.filter((c) => c.esempio)));
      }
    } catch (e) {
      metti(Viste.html`<p class="avviso-flash avviso-errore" role="alert">${Archivio.messaggioErrore(e)}</p>`);
    }
  }

  // Arrivano dati nuovi (anche da un altro computer): aggiorno solo ciò che serve,
  // senza toccare moduli che qualcuno sta compilando.
  function aggiornaDati() {
    const r = S.rotta;
    if (!r) return;
    const metti = (id, html) => { const el = document.getElementById(id); if (el) el.innerHTML = String(html); };
    if (r.vista === "oggi") {
      metti("zona-oggi", Viste.zonaOggi(S));
      metti("riepilogo", Viste.riepilogo(S));
    } else if (r.vista === "clienti") {
      metti("zona-elenco", Viste.zonaElenco(S, r.filtro));
    } else if (r.vista === "scheda") {
      const c = S.clienti.find((x) => x.id === r.id);
      const conferma = document.getElementById("conferma-elimina");
      const confermaAperta = !!conferma && conferma.hidden === false;
      if (c && !confermaAperta) contenuto.innerHTML = String(Viste.scheda(S, c));
    }
  }

  async function caricaArchiviati() {
    if (S.archiviati !== null) return;
    try {
      const lista = await Archivio.clientiArchiviati();
      S.archiviati = lista.sort(Regole.perCognome);
    } catch (e) {
      S.archiviati = [];
      mostraBanner(Archivio.messaggioErrore(e));
    }
    aggiornaDati();
  }

  function mostraBanner(testo, tipo) {
    banner.textContent = testo;
    banner.className = "avviso-flash " + (tipo === "info" ? "avviso-info" : "avviso-errore");
    banner.hidden = !testo;
  }

  function aggiornaNomePalestra() {
    document.querySelector(".marchio").textContent = S.imp.nome_palestra;
    document.title = S.imp.nome_palestra + " – Gestionale";
  }

  /* --------------------------------------------- salvataggi e azioni */
  function occupato(pulsante, testo) {
    const prima = pulsante.textContent;
    pulsante.disabled = true;
    pulsante.textContent = testo;
    return () => { pulsante.disabled = false; pulsante.textContent = prima; };
  }

  async function controllaUnici(dati, idEscluso) {
    const errori = {};
    for (const [campo, testo] of Object.entries(Regole.CAMPI_UNICI)) {
      if (!dati[campo]) continue;
      const ids = await Archivio.clientiCon(campo, dati[campo]);
      if (ids.some((id) => id !== idEscluso)) errori[campo] = testo;
    }
    return errori;
  }

  async function salvaCliente(form) {
    const id = form.dataset.id || null;
    const pulsante = form.querySelector("button[type=submit]");
    const { dati, errori } = Regole.leggiModuloCliente(form);
    const cliente = id ? await trovaCliente(id) : null;
    const rimostra = (err) => {
      contenuto.innerHTML = String(Viste.modulo(S, cliente, dati, err));
      window.scrollTo(0, 0);
    };
    if (Object.keys(errori).length) return rimostra(errori);

    const libera = occupato(pulsante, "Salvataggio…");
    try {
      const doppi = await controllaUnici(dati, id);
      if (Object.keys(doppi).length) return rimostra(doppi);
      if (id) {
        await Archivio.aggiornaCliente(id, dati);
        S.leggiDiNuovo = id;
        vai("cliente-" + id, { tipo: "ok", testo: "Modifiche salvate." });
      } else {
        const nuovo = await Archivio.creaCliente(dati);
        S.leggiDiNuovo = nuovo;
        vai("cliente-" + nuovo, { tipo: "ok", testo: `${dati.nome} ${dati.cognome} è stato aggiunto ai clienti.` });
      }
    } catch (e) {
      rimostra({ _: Archivio.messaggioErrore(e) });
    } finally {
      libera();
    }
  }

  async function salvaImpostazioni(form) {
    const pulsante = form.querySelector("button[type=submit]");
    const nome = form.elements.nome_palestra.value.trim() || Archivio.IMPOSTAZIONI_PREDEFINITE.nome_palestra;
    const giorni = Math.min(120, Math.max(1, parseInt(form.elements.giorni_preavviso.value, 10) || 30));
    const nuove = {
      nome_palestra: nome,
      giorni_preavviso: giorni,
      usa_tesseramento: form.elements.usa_tesseramento.checked,
    };
    const libera = occupato(pulsante, "Salvataggio…");
    try {
      await Archivio.salvaImpostazioni(nuove);
      S.imp = { ...S.imp, ...nuove };
      aggiornaNomePalestra();
      vai("impostazioni", { tipo: "ok", testo: "Impostazioni salvate." });
    } catch (e) {
      vai("impostazioni", { tipo: "errore", testo: Archivio.messaggioErrore(e) });
    } finally {
      libera();
    }
  }

  // Clienti inventati, con scadenze calcolate da oggi: così i colori hanno sempre senso
  function clientiDiEsempio() {
    const t = Regole.dataTra;
    const base = { codice_fiscale: null, indirizzo: null, contatto_emergenza: null, note: null, esempio: true };
    return [
      { ...base, nome: "Giulia", cognome: "Bianchi", data_nascita: "1994-03-12", email: "giulia.bianchi@example.com", telefono: "333 1234567",
        numero_tessera: "A001", scadenza_tessera: t(300), scadenza_certificato: t(200), liberatoria_il: t(-40), privacy_il: t(-40), autonomo: true },
      { ...base, nome: "Marco", cognome: "Rossi", data_nascita: "1988-07-02", email: "marco.rossi@example.com", telefono: "347 7654321",
        numero_tessera: "A002", scadenza_tessera: t(300), scadenza_certificato: t(-5), liberatoria_il: t(-100), privacy_il: t(-100), autonomo: true },
      { ...base, nome: "Sara", cognome: "Conti", data_nascita: "2011-05-20", email: null, telefono: "320 1112223",
        contatto_emergenza: "Paolo Conti (papà) 320 1112224", note: "Viene con il papà il sabato mattina.",
        numero_tessera: "A003", scadenza_tessera: t(150), scadenza_certificato: t(150), liberatoria_il: null, privacy_il: null, autonomo: false },
      { ...base, nome: "Luca", cognome: "Ferrari", data_nascita: "1999-11-30", email: "luca.ferrari@example.com", telefono: null,
        numero_tessera: "A004", scadenza_tessera: t(300), scadenza_certificato: t(12), liberatoria_il: t(-10), privacy_il: t(-10), autonomo: false },
      { ...base, nome: "Elena", cognome: "Gallo", data_nascita: "1979-01-15", email: null, telefono: "349 5556667",
        numero_tessera: "A005", scadenza_tessera: t(250), scadenza_certificato: t(365), liberatoria_il: t(-300), privacy_il: t(-300), autonomo: true },
    ];
  }

  const AZIONI = {
    async "carica-esempi"() {
      for (const c of clientiDiEsempio()) await Archivio.creaCliente(c);
      return { tipo: "ok", testo: "Ho aggiunto 5 clienti di esempio. Li elimini quando vuoi da Impostazioni." };
    },
    async liberatoria(id) {
      await Archivio.aggiornaCliente(id, { liberatoria_il: Regole.oggiISO() });
      S.leggiDiNuovo = id;
      return { tipo: "ok", testo: "Liberatoria registrata con la data di oggi." };
    },
    async archivia(id) {
      await Archivio.aggiornaCliente(id, { attivo: false });
      S.archiviati = null;
      S.leggiDiNuovo = id;
      return { tipo: "ok", testo: "Cliente archiviato. Lo trovi nel filtro Archiviati." };
    },
    async riattiva(id) {
      await Archivio.aggiornaCliente(id, { attivo: true });
      S.archiviati = null;
      S.leggiDiNuovo = id;
      return { tipo: "ok", testo: "Cliente riattivato." };
    },
    async elimina(id) {
      await Archivio.eliminaCliente(id);
      S.archiviati = null;
      vai("clienti-archiviati", { tipo: "ok", testo: "Cliente eliminato definitivamente." });
      return null;
    },
    async "elimina-esempi"() {
      const archiviati = await Archivio.clientiArchiviati();
      const esempi = [...S.clienti, ...archiviati].filter((c) => c.esempio);
      for (const c of esempi) await Archivio.eliminaCliente(c.id);   // uno alla volta
      S.archiviati = null;
      return { tipo: "ok", testo: "Clienti di esempio eliminati. Il gestionale è pronto per i clienti veri." };
    },
  };

  /* ------------------------------------------------------------ eventi */
  window.addEventListener("hashchange", mostra);

  document.addEventListener("input", (e) => {
    if (e.target.id !== "cerca") return;
    S.ricerca = e.target.value;
    aggiornaDati();
  });

  document.addEventListener("keydown", (e) => {
    if (e.target.id !== "cerca" || e.key !== "Enter") return;
    e.preventDefault();
    const testo = S.ricerca.trim().toLowerCase();
    const lista = S.rotta.filtro === "clienti-archiviati" ? (S.archiviati || []) : S.clienti;
    const perTessera = lista.find((c) => (c.numero_tessera || "").toLowerCase() === testo);
    const trovati = lista.filter((c) => Regole.corrisponde(c, S.ricerca));
    const scelto = perTessera || (trovati.length === 1 ? trovati[0] : null);
    if (scelto) { S.ricerca = ""; vai("cliente-" + scelto.id); }
  });

  document.addEventListener("click", async (e) => {
    const oggi = e.target.closest("[data-oggi]");
    if (oggi) {
      const campo = document.getElementById(oggi.dataset.oggi);
      campo.value = Regole.oggiISO();
      return;
    }
    const pulsante = e.target.closest("[data-azione]");
    if (!pulsante) return;
    const azione = pulsante.dataset.azione;
    const conferma = document.getElementById("conferma-elimina");
    if (azione === "chiedi-elimina") { conferma.hidden = false; conferma.querySelector("button").focus(); return; }
    if (azione === "annulla-elimina") { conferma.hidden = true; return; }

    const libera = occupato(pulsante, "Un momento…");
    try {
      const esito = await AZIONI[azione](pulsante.dataset.id);
      if (esito) { S.messaggio = esito; mostra(); }
    } catch (err) {
      S.messaggio = { tipo: "errore", testo: Archivio.messaggioErrore(err) };
      mostra();
    } finally {
      libera();
    }
  });

  document.addEventListener("submit", (e) => {
    const form = e.target;
    e.preventDefault();
    if (form.dataset.modulo === "cliente") salvaCliente(form);
    if (form.dataset.modulo === "impostazioni") salvaImpostazioni(form);
  });

  /* ------------------------------------------------------------ avvio */
  async function avvia() {
    contenuto.innerHTML = String(Viste.caricamento("Collegamento al database…"));
    const st = await Archivio.avvia();
    S.puoScrivere = st.puoScrivere !== false;   // se non si sa, si prova: decide il database
    S.amministratore = st.amministratore;
    S.nomeUtente = st.nomeUtente;
    S.modalita = st.modalita;
    S.memoriaOk = st.memoriaOk;
    document.querySelector(".operatore").textContent = st.nomeUtente;

    if (!st.disponibile) {
      contenuto.innerHTML = String(Viste.nonDisponibile());
      return;
    }
    if (S.modalita === "locale") {
      mostraBanner(S.memoriaOk
        ? "Versione di prova: i dati restano solo in questo browser, su questo dispositivo."
        : "Versione di prova: questo browser non lascia salvare i dati, chiudendo la pagina si perdono.", "info");
    }
    if (!S.puoScrivere) mostraBanner("Puoi solo consultare: per aggiungere o modificare clienti serve il permesso di modifica.");

    const attesa = setTimeout(() => { S.lento = true; aggiornaDati(); }, 10000);
    Archivio.ascoltaClientiAttivi((lista, info) => {
      S.clienti = lista.sort(Regole.perCognome);
      S.caricati = true;
      if (!info.fromCache) { clearTimeout(attesa); S.lento = false; }
      aggiornaDati();
    }, (errore) => {
      clearTimeout(attesa);
      S.caricati = true;
      mostraBanner(Archivio.messaggioErrore(errore));
      aggiornaDati();
    });
    Archivio.ascoltaImpostazioni((imp) => {
      S.imp = imp;
      aggiornaNomePalestra();
      aggiornaDati();
    }, () => { /* restano le impostazioni predefinite */ });

    mostra();
  }

  avvia();
}

</script>
